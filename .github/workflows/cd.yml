name: Continuous Deployment (CD)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run mode (validate & simulate without making changes to AWS)'
        type: boolean
        default: true
        required: true
      invalidate_cache:
        description: 'Invalidate CloudFront cache after deployment'
        type: boolean
        default: true
        required: false

permissions:
  id-token: write
  contents: read

jobs:
  build:
    name: Build Frontend Bundle
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: Build Static Production Assets
        run: npm run build

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-artifacts
          path: frontend/dist/
          retention-days: 1

  deploy:
    name: Deploy to AWS S3 & CloudFront
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-artifacts
          path: ./frontend/dist

      - name: Dry-Run Simulation Check
        if: ${{ inputs.dry_run == true }}
        run: |
          echo "========================================================"
          echo "🚀 CI/CD PIPELINE: DRY-RUN SIMULATION MODE ACTIVE"
          echo "========================================================"
          echo "Dry run is ENABLED. No changes will be written to AWS."
          echo ""
          echo "Build Artifacts verified:"
          ls -la ./frontend/dist
          echo ""
          echo "Target Configuration (Simulated):"
          echo "  - S3 Bucket:              ${{ secrets.S3_BUCKET_NAME || 'mock-bucket-name' }}"
          echo "  - CloudFront Distribution: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID || 'mock-distribution-id' }}"
          echo "  - Cache-Control Strategy:"
          echo "      * dist/assets/*  -> public, max-age=31536000, immutable"
          echo "      * dist/*.html    -> no-cache, no-store, must-revalidate"
          echo "  - CloudFront Invalidation: ${{ inputs.invalidate_cache }}"
          echo ""
          echo "✓ Dry-run completed successfully with zero cloud mutations."
          echo "========================================================"

      # The following live deployment steps only execute when dry_run is explicitly FALSE
      - name: Configure AWS Credentials (Live Mode Only)
        if: ${{ inputs.dry_run == false }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'ap-southeast-1' }}

      - name: Deploy Hashed Assets to S3 (Live Mode Only)
        if: ${{ inputs.dry_run == false }}
        run: |
          aws s3 sync ./frontend/dist/assets s3://${{ secrets.S3_BUCKET_NAME }}/assets \
            --delete \
            --cache-control "public, max-age=31536000, immutable"

      - name: Deploy Static HTML & Root Files to S3 (Live Mode Only)
        if: ${{ inputs.dry_run == false }}
        run: |
          aws s3 sync ./frontend/dist s3://${{ secrets.S3_BUCKET_NAME }} \
            --delete \
            --exclude "assets/*" \
            --cache-control "no-cache, no-store, must-revalidate"

      - name: Invalidate CloudFront Cache (Live Mode Only)
        if: ${{ inputs.dry_run == false && inputs.invalidate_cache == true }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
